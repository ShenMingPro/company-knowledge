services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-knowbase}"
      MYSQL_USER: "${MYSQL_USER:-knowbase}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-knowbase_password}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-change_this_root_password}"
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-knowbase}"
      MYSQL_USER: "${MYSQL_USER:-knowbase}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-knowbase_password}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}"
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      JWT_ISSUER: "${JWT_ISSUER:-knowbase-api}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-knowbase-web}"
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-60}"
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
      REDIS_TIMEOUT_SECONDS: "${REDIS_TIMEOUT_SECONDS:-0.5}"
      CACHE_TTL_SECONDS: "${CACHE_TTL_SECONDS:-60}"
      TASK_STATUS_TTL_SECONDS: "${TASK_STATUS_TTL_SECONDS:-86400}"
      RATE_LIMIT_WINDOW_SECONDS: "${RATE_LIMIT_WINDOW_SECONDS:-60}"
      RATE_LIMIT_LOGIN_IP_REQUESTS: "${RATE_LIMIT_LOGIN_IP_REQUESTS:-60}"
      RATE_LIMIT_LOGIN_REQUESTS: "${RATE_LIMIT_LOGIN_REQUESTS:-10}"
      RATE_LIMIT_QUERY_REQUESTS: "${RATE_LIMIT_QUERY_REQUESTS:-30}"
      RATE_LIMIT_UPLOAD_REQUESTS: "${RATE_LIMIT_UPLOAD_REQUESTS:-10}"
      DOCUMENT_STORAGE_DIR: /app/data/documents
      UPLOAD_MAX_BYTES: "${UPLOAD_MAX_BYTES:-20971520}"
      ALLOWED_DOCUMENT_EXTENSIONS: "${ALLOWED_DOCUMENT_EXTENSIONS:-.pdf,.docx,.txt,.xlsx}"
      MODEL_PROVIDER: "${MODEL_PROVIDER:-dashscope}"
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:-}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OLLAMA_CHAT_MODEL: "${OLLAMA_CHAT_MODEL:-qwen2:7b}"
      OLLAMA_EMBEDDING_MODEL: "${OLLAMA_EMBEDDING_MODEL:-bge-m3:latest}"
      DEMO_EMPLOYEE_PASSWORD: "${DEMO_EMPLOYEE_PASSWORD:-employee123}"
      DEMO_SERVICE_PASSWORD: "${DEMO_SERVICE_PASSWORD:-service123}"
      DEMO_ADMIN_PASSWORD: "${DEMO_ADMIN_PASSWORD:-admin123}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_PATH: /app/logs
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
      args:
        VITE_API_PREFIX: "${VITE_API_PREFIX:-/api}"
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
